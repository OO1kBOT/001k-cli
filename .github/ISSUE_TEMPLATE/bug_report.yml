name: Bug report
description: Report a problem with the 001k CLI or skill
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "WARNING: Never paste API keys, secret keys, or profile files here."
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the exact command (redact secrets) and the JSON output.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: CLI version (001k --version)
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version (node --version)
    validations:
      required: true
